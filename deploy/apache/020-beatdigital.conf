# Beat 100.9 — el sitio real. beatdigital.mx sirve el v2.
#
# 🔴 Este archivo SUMA, no reemplaza. Apache resuelve por `ServerName`: en cuanto
# este vhost reclama `beatdigital.mx`, le gana al comodín `000-default`, que sigue
# sirviendo el v1 estático para cualquier Host que nadie reclame. Por eso el corte
# es un `a2ensite` y la vuelta atrás un `a2dissite` — sin tocar el v1, que se
# queda intacto en su sitio por si hay que volver.
#
# 🔴 Prefijo 020: después de 010-v2 y MUY después de 000-default. Apache usa el
# PRIMER vhost como predeterminado para lo que nadie reclame, y ese papel es de
# 000-default. No renumerar.
#
# 🔴 Aquí NO hay DocumentRoot. El sitio es Astro SSR: un proceso Node en el 4322
# (systemd: web-beat-v2.service). Si ese servicio está caído, esto da 502 — no
# aparece el sitio viejo.
#
# ⚠️ Es una copia de `010-v2-beatdigital.conf` con tres cambios y nada más:
# el `ServerName`, el certificado y los nombres de los registros. El puerto del
# backend es EL MISMO: los dos nombres sirven el mismo proceso, y es justo lo que
# hace que el corte no necesite reconstruir nada.

<VirtualHost *:80>
    ServerName beatdigital.mx

    # 🔴 `www` va aquí, en el :80, y NO en el :443. No es una asimetría descuidada:
    #
    #  · En el :80 hace falta para PEDIR el certificado. El reto http-01 de
    #    Let's Encrypt llega con `Host: www.beatdigital.mx`, y sin este alias
    #    ningún vhost lo reclama: cae en el predeterminado, cuya raíz es
    #    `/var/www/html`, y el reto da 404. Es exactamente como falló el 10 sep:
    #    el ápex validó y `www` no.
    #  · En el :443 NO puede ir hasta que el certificado cubra `www`, porque
    #    servirlo bajo un certificado que no lo nombra da error de nombre en el
    #    navegador — peor que no responder.
    #
    # Y de paso arregla lo que se veía mal el día del lanzamiento: hasta ahora
    # `http://www.beatdigital.mx` respondía 200 sirviendo el sitio VIEJO. Con este
    # alias, el RewriteRule de abajo lo manda al ápex en https.
    ServerAlias www.beatdigital.mx

    # 🔴 El reto de Let's Encrypt se sirve del DISCO: ni se proxea ni se redirige.
    # Sin la exclusión del proxy, Node contestaría 404 al reto; sin la condición
    # del RewriteRule, la redirección a HTTPS se lo llevaría. Las renovaciones
    # automáticas entran por aquí, así que esto tiene que seguir vivo.
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Require all granted
        Options -Indexes
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    # Todo lo demás sube a HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://beatdigital.mx%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/beat-error.log
    CustomLog ${APACHE_LOG_DIR}/beat-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName beatdigital.mx

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/beatdigital.mx/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/beatdigital.mx/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # 🔴 ProxyPreserveHost On es OBLIGATORIO, y aquí más que en la preproducción:
    #
    #  1. Sin él, Apache reescribe el Host a "127.0.0.1:4322". El adaptador de node
    #     descarta el Host que no puede validar contra security.allowedDomains y cae
    #     a "localhost"; entonces checkOrigin compara "localhost" contra el dominio
    #     real y TODO POST da 403. Eso es el login y el registro de oyentes.
    #  2. Y es lo que ABRE el sitio a Google. Las cuatro capas de indexación
    #     —cabecera, meta, robots.txt y sitemap— miran el Host de la petición. Con
    #     el Host preservado y este ServerName, las cuatro se abren solas: el MISMO
    #     artefacto que servía la preproducción cerrada sirve el sitio real
    #     indexable. Sin él, el sitio real se queda en noindex y nadie se entera.
    #
    # ⚠️ Corolario: NO pongas delante un proxy que reescriba el Host. Es la misma
    # advertencia que el vhost de v2, y aquí el precio es el inverso: allí abriría
    # un duplicado, aquí cerraría el sitio real.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:4322/
    ProxyPassReverse / http://127.0.0.1:4322/

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml
        BrotliCompressionQuality 4
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/beat-error.log
    CustomLog ${APACHE_LOG_DIR}/beat-access.log combined
</VirtualHost>

# 🔴 `www` en HTTPS: un vhost APARTE que solo redirige, y no un `ServerAlias` en el
# bloque de arriba.
#
# Con un alias, el sitio se serviría entero bajo los DOS nombres: contenido
# duplicado, el canonical peleándose con la URL de la barra, y las cookies y la
# analítica partidas en dos hosts. Con un vhost propio, `www` existe solo para
# mandarte al ápex y desaparecer.
#
# ⚠️ Esto NO puede existir hasta que el certificado cubra `www` —lo cubre desde el
# 10 sep 2026, con `--expand`— porque termina el TLS antes de poder redirigir: un
# certificado que no nombre a `www` da error en el navegador ANTES de que el 301
# llegue a leerse. Si algún día se rehace el certificado sin `www`, este bloque
# tiene que salir a la vez.
<VirtualHost *:443>
    ServerName www.beatdigital.mx

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/beatdigital.mx/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/beatdigital.mx/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # `Redirect` y no `RewriteRule`: conserva la ruta y la query tal cual, que es
    # todo lo que hace falta, y no depende de mod_rewrite.
    Redirect permanent / https://beatdigital.mx/

    ErrorLog ${APACHE_LOG_DIR}/beat-error.log
    CustomLog ${APACHE_LOG_DIR}/beat-access.log combined
</VirtualHost>
</IfModule>

# ⚠️ `www.beatdigital.mx` está en el :80 y NO en el :443, y el orden importa.
#
# 🔴 CORRECCIÓN del 10 sep 2026, aprendida fallando. Antes aquí decía que el orden
# correcto era «primero ampliar el certificado SIN TOCAR VHOSTS y después añadir el
# alias». Eso no funciona, y se comprobó en el lanzamiento: certbot falló con
#
#   Detail: 34.169.1.149: Invalid response from
#   http://www.beatdigital.mx/.well-known/acme-challenge/… : 404
#
# porque el reto http-01 llega con `Host: www.beatdigital.mx` y, sin alias en el
# :80, ningún vhost lo reclamaba: lo atendía el predeterminado desde
# `/var/www/html`, donde certbot no escribe nada. El ápex validó en la misma
# corrida, que es lo que hace el fallo confuso: el mismo comando, un dominio bien y
# el otro 404.
#
# El orden que SÍ funciona, y es el que refleja este archivo:
#
#   1. `ServerAlias www.beatdigital.mx` en el bloque :80 (arriba). Sirve el reto
#      desde /var/www/acme y de paso manda el tráfico de www al ápex.
#   2. Recargar Apache y AHORA sí pedir el certificado:
#
#        sudo certbot certonly --webroot -w /var/www/acme \
#          -d beatdigital.mx -d www.beatdigital.mx --expand
#
#   3. Con el certificado ya cubriendo www, el vhost :443 de www que redirige al
#      ápex — el tercer bloque de este archivo.
#
# Los tres pasos están HECHOS (10 sep 2026). El certificado cubre `beatdigital.mx`
# y `www.beatdigital.mx` hasta el 9 dic 2026 y vive en el linaje de siempre,
# `/etc/letsencrypt/live/beatdigital.mx/`, así que las rutas de arriba no cambian.
#
# ⚠️ La renovación automática de `www` depende del `ServerAlias` del bloque :80. Si
# alguien lo quita «porque el 301 ya está en el :443», la próxima renovación falla
# con el mismo 404 del 10 sep — y esta vez en silencio, dentro de un cron.
