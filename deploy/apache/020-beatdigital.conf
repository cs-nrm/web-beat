# Beat 100.9 — el sitio real. beatdigital.mx sirve el v2.
#
# 🔴 Este archivo SUMA, no reemplaza. Apache resuelve por `ServerName`: en cuanto
# este vhost reclama `beatdigital.mx`, le gana al comodín `000-default`, que sigue
# sirviendo el v1 estático para cualquier Host que nadie reclame. Por eso el corte
# es un `a2ensite` y la vuelta atrás un `a2dissite` — sin tocar el v1, que se
# queda intacto en su sitio por si hay que volver.
#
# 🔴 Prefijo 020: después de 010-v2 y MUY después de 000-default. Apache usa el
# PRIMER vhost como predeterminado para lo que nadie reclame, y ese papel es de
# 000-default. No renumerar.
#
# 🔴 Aquí NO hay DocumentRoot. El sitio es Astro SSR: un proceso Node en el 4322
# (systemd: web-beat-v2.service). Si ese servicio está caído, esto da 502 — no
# aparece el sitio viejo.
#
# ⚠️ Es una copia de `010-v2-beatdigital.conf` con tres cambios y nada más:
# el `ServerName`, el certificado y los nombres de los registros. El puerto del
# backend es EL MISMO: los dos nombres sirven el mismo proceso, y es justo lo que
# hace que el corte no necesite reconstruir nada.

<VirtualHost *:80>
    ServerName beatdigital.mx

    # 🔴 El reto de Let's Encrypt se sirve del DISCO: ni se proxea ni se redirige.
    # Sin la exclusión del proxy, Node contestaría 404 al reto; sin la condición
    # del RewriteRule, la redirección a HTTPS se lo llevaría. Las renovaciones
    # automáticas entran por aquí, así que esto tiene que seguir vivo.
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Require all granted
        Options -Indexes
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    # Todo lo demás sube a HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://beatdigital.mx%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/beat-error.log
    CustomLog ${APACHE_LOG_DIR}/beat-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName beatdigital.mx

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/beatdigital.mx/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/beatdigital.mx/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # 🔴 ProxyPreserveHost On es OBLIGATORIO, y aquí más que en la preproducción:
    #
    #  1. Sin él, Apache reescribe el Host a "127.0.0.1:4322". El adaptador de node
    #     descarta el Host que no puede validar contra security.allowedDomains y cae
    #     a "localhost"; entonces checkOrigin compara "localhost" contra el dominio
    #     real y TODO POST da 403. Eso es el login y el registro de oyentes.
    #  2. Y es lo que ABRE el sitio a Google. Las cuatro capas de indexación
    #     —cabecera, meta, robots.txt y sitemap— miran el Host de la petición. Con
    #     el Host preservado y este ServerName, las cuatro se abren solas: el MISMO
    #     artefacto que servía la preproducción cerrada sirve el sitio real
    #     indexable. Sin él, el sitio real se queda en noindex y nadie se entera.
    #
    # ⚠️ Corolario: NO pongas delante un proxy que reescriba el Host. Es la misma
    # advertencia que el vhost de v2, y aquí el precio es el inverso: allí abriría
    # un duplicado, aquí cerraría el sitio real.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:4322/
    ProxyPassReverse / http://127.0.0.1:4322/

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml
        BrotliCompressionQuality 4
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/beat-error.log
    CustomLog ${APACHE_LOG_DIR}/beat-access.log combined
</VirtualHost>
</IfModule>

# ⚠️ `www.beatdigital.mx` NO está aquí a propósito.
#
# Su DNS ya apunta a esta máquina, pero el certificado de `beatdigital.mx` cubre
# solo el ápex —comprobado: el SAN es `DNS:beatdigital.mx` y nada más—. Un
# ServerAlias de www sobre este certificado daría error de nombre en el navegador,
# que es peor que lo de hoy.
#
# El orden correcto es: primero ampliar el certificado sin tocar vhosts
#
#   sudo certbot certonly --webroot -w /var/www/acme \
#     -d beatdigital.mx -d www.beatdigital.mx --expand
#
# y DESPUÉS añadir aquí `ServerAlias www.beatdigital.mx` en los dos bloques, más
# un 301 de www al ápex para no servir el sitio bajo dos nombres.
