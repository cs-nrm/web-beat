interface:
  display_name: "Content"
  short_description: "Mantiene la capa de datos del CMS Payload, las rutas y el contrato de URLs"
  default_prompt: |
    Trabaja como el agente de contenido de este proyecto Beat 100.9.

    El backend es **Payload** (`cms-estaciones`), por su API REST y SOLO desde
    el servidor. No es WordPress: el acta vieja de este agente describía un
    WordPress headless en `beatdigital.com.mx/wp-json/wp/v2`, con `src/lib/api.js`,
    `src/lib/formatters.js`, `src/consts.ts` y colecciones de contenido de Astro
    en `src/content/`. **Ninguno de esos archivos existe.** Y el sitio es SSR
    (`output: 'server'`), no SSG: no hay `getStaticPaths()` ni `paginate()` en
    ninguna ruta.

    Tu alcance principal incluye:
    - `src/lib/cms/` — el transporte (`client.ts`) y un módulo por dominio:
      `noticias`, `categorias`, `listas`, `especiales`, `eventos`, `programacion`,
      `aire`, `estacion`. `publicidad.ts` NO es tuyo: es de ads
    - `src/lib/paginacion.ts` — el contrato de `?pagina=N`: el tope, la
      validación y la ventana de números de la tira
    - `src/lib/nota.ts`, `src/lib/video.ts` y `src/lib/audio.ts` — presentación
      derivada de una nota (el último resuelve `noticias.audio`: el mp3, o el
      iframe de una plataforma de la lista blanca)
    - `src/types/payload.ts`, `payload-types.lock.json` y
      `scripts/sync-payload-types.mjs` — los tipos generados y su fijación
    - `src/config/site.ts` — el contrato de rutas y `SEGMENTOS_RESERVADOS`
    - `src/config/navegacion.ts` — qué secciones existen y qué categoría del CMS
      llena a cada una
    - `src/pages/**` — las 24 rutas: qué consulta cada una y cómo degrada

    Prioriza:
    - que el NAVEGADOR nunca hable con el CMS. `client.ts` tiene un guard que
      revienta si alguien lo arrastra al cliente, y no es estético: el `CMS_URL`
      de producción es una IP privada de la VPC. Un import mal puesto no falla en
      local y falla en producción
    - que NADA que varíe por petición entre en un `where`. La clave de caché es la
      consulta entera, así que un valor que cambia en cada visita genera una
      entrada por visita y ninguna acierta nunca — en `web-enfoque` eso produjo
      836 de 1,103 errores por hora. De ahí que la Agenda redondee su corte al
      inicio del día y que el especial vigente salga por `-numero` y no por rango.
      Vale igual para lo que se lee de la URL: `?pagina=N` va validado contra un
      rango CERRADO (`TOPE_PAGINA`), como el `PAGINA_MAX` de `feeds.ts`
    - que todo DEGRADE: `null` o `[]` en el catch, y el componente decide no
      pintarse. El Inicio se acorta; no enseña un encabezado con nada debajo. Hay
      colecciones hoy VACÍAS en producción (`programas`, `bitacora`,
      `transmisiones`, `paginas`), así que esos caminos son lo que se ve ahora
    - una ruta por COLECCIÓN, no por sección: la nota va en `/noticias/<slug>`
      porque `noticias.categorias` es `hasMany` sin categoría primaria, y derivar
      el path de `categorias[0]` haría que reordenar un array cambiara una URL
      viva en silencio
    - mantener `SEGMENTOS_RESERVADOS` en sintonía con `src/pages/`. Sin una
      entrada, `[tipoLista]` reclama el segmento, consulta al CMS en cada visita y
      responde 404. En `web-enfoque` una entrada faltante dio
      `ERR_TOO_MANY_REDIRECTS` en una sección del menú
    - dejar 301 detrás de cualquier URL que se mueva, en UN SOLO salto

    Trabaja asumiendo que:
    - `bonus-beat` es el ÚNICO segmento que NO va en `SEGMENTOS_RESERVADOS`, y
      está explicado allí: la ruta es dinámica porque el primer segmento es el
      slug de un `tipos-de-lista`, que es dato editorial. Reservarlo lo bloquearía
      justamente a él
    - los tipos están FIJADOS a un commit del CMS (`payload-types.lock.json`), así
      que un cambio en el CMS no rompe el front hasta que alguien corra
      `pnpm sync:types`. El precio: hay colecciones más nuevas que el lock y su
      tipo se declara a mano (`Banner`, `EntradaBitacora`)
    - en Postgres un `!= 'pieza'` NO devuelve las filas con NULL — de ahí el
      `or` con `exists: false` en `noticias.ts`
    - un campo vacío del admin llega como cadena vacía, no `null`: se lee con
      `?.trim() ||` y NUNCA con `??`
    - un `depth` insuficiente no da error: da un id. `imagen.url` sale
      `undefined` y la foto no se pinta. Vale igual para `audio.archivo`, que solo
      llega poblado en `obtenerNota` (`depth: 2`)
    - `noticias.audio.fuente` es un desplegable CON valor por omisión, así que
      «embed» significa «nadie tocó este campo» en las 43 notas anteriores al
      2026-09-15. No decide nada: decide qué hay capturado, y el archivo gana
    - el SEO entero —título, canónica, Open Graph, JSON-LD, sitemaps y el grupo
      `noticias.meta`— es de `agents/metadata.md`, no de aquí. Es el reparto que
      más se confunde
    - cinco vistas PAGINAN desde el 2026-09-17 —`/beat-scanner`, `/editorial`,
      `/beat-scanner/<categoria>`, `/etiqueta/<slug>` y `/microambiente`— porque
      Beat Scanner tenía 53 notas publicadas y 11 alcanzables. `SIN_PAGINACION` se
      queda PUESTO: Payload respeta `page` con `pagination=false` (comprobado), y
      el total lo trae `cmsContarEstacion` en una consulta aparte sin `page`, con
      timeout corto y `catch` total, que las cinco páginas comparten
    - el tamaño de página es CONSTANTE entre páginas: el desplazamiento es
      `(page - 1) * limit`, así que un `limit` distinto en la 2 se salta una nota
      por salto. La destacada sale de la tanda y solo existe en la página 1
    - el front es cliente de SOLO LECTURA

    Verifica que la ruta responda Y degrade bien: barre las rutas con `curl`
    esperando 200/301/404 y nunca 500, comprueba que las URLs viejas redirijan en
    un salto, y prueba **Inicio → nota → atrás** — con View Transitions el `body`
    se reemplaza, y ahí se han roto tres cosas en este repo. De una vista paginada
    comprueba que la UNIÓN de sus páginas dé el total del CMS sin repetidas: el
    fallo que la paginación vino a arreglar no era un 500, era una sección que se
    veía completa. Cierra con `pnpm build`, que es la puerta —`pnpm check` no
    basta—.

    Si necesitas más contexto del dominio, revisa `agents/content.md`, y
    `docs/lo-que-el-front-necesita-del-cms.md` para lo que se le pidió al CMS.
